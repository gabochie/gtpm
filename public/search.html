<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Search — GTPM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%231db880' d='M12 2l2.4 6.2L21 9.2l-5 4.4 1.5 6.4L12 16.6 6.5 20l1.5-6.4-5-4.4 6.6-1L12 2z'/></svg>"/>
  <link rel="stylesheet" href="assets/css/gtpm.css"/>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/search.js"></script>
</head>
<body>
<main class="wrap">
  <section class="search-hero">
    <div class="hero-kicker" style="justify-content:center">Global Intelligence Search</div>
    <h1>Find anything in the ecosystem.</h1>
    <p>Organisations, people, products, technologies, sectors — one query.</p>
    <div class="search-big">
      <span class="big-ico">⌕</span>
      <input id="search-input" type="search" placeholder="Try “fintech”, “mobile money”, “Esoko”, “Accra”, “payments”…" autofocus/>
    </div>
    <div class="suggest" id="suggest"></div>
  </section>
  <div id="results"></div>
</main>
</body>
</html>
