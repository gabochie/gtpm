<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Companies — GTPM</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%231db880' d='M12 2l2.4 6.2L21 9.2l-5 4.4 1.5 6.4L12 16.6 6.5 20l1.5-6.4-5-4.4 6.6-1L12 2z'/></svg>"/>
  <link rel="stylesheet" href="assets/css/gtpm.css"/>
  <script defer src="assets/js/api.js"></script>
  <script defer src="assets/js/ui.js"></script>
  <script defer src="assets/js/layout.js"></script>
  <script defer src="assets/js/companies.js"></script>
</head>
<body>
<main class="wrap">
  <section class="hero" style="padding:32px 0 24px">
    <div class="hero-kicker">Intelligence Directory</div>
    <h1 style="font-size:38px">Organisations</h1>
    <p class="hero-sub" style="font-size:15px">Every tracked organisation shaping Ghana's technology ecosystem — with provenance, confidence and competitive context.</p>
  </section>

  <div class="filters">
    <div><label>Filter</label></div>
    <select id="f-type"><option value="">All types</option></select>
    <select id="f-sector"><option value="">All sectors</option></select>
    <input type="text" id="f-q" placeholder="Search name or description…"/>
    <button id="f-reset" class="chip" type="button">Reset</button>
  </div>

  <div id="companies-root"></div>
  <div id="pager"></div>
</main>
</body>
</html>
